name: Full scrape

# Full catalogue scrape: runs every scraper from scratch, followed by its
# in-matrix availability pass (SeatPlan price/chip verification, OLT
# verifier, TTD seat verification, LoveTheatre + TodayTix availability),
# dedupes, and commits unified.json. ~3-6 minutes.
#
# Trigger: manual only -- the "Run workflow" button in the Actions tab, or
# a workflow_dispatch via the GitHub REST API (what an external scheduler
# like cron-job.org calls). Run this as often as the runner allows: each
# run re-fetches the full catalogue + prices AND re-probes availability
# inline, so the published data reflects what's actually on sale at scrape
# time. A separate, lighter workflow (availability.yml) re-probes
# availability between full runs on its own cron-job.org cadence.
#
# Concurrency: this workflow and availability.yml share ONE concurrency
# group (scrape-and-refresh) so their commits to main never race.
#
# About OLT: officiallondontheatre.com 403s requests from cloud IP ranges
# (Azure / GitHub Actions) on every URL, HTML and wp-json API alike. We
# route the scraper through a Cloudflare Worker reverse proxy deployed
# under the user's CF account -- not in the blocked range -- which rewrites
# the path onto the OLT origin and forwards the response. Auth is a shared
# secret (X-Proxy-Auth header). Credentials live in the OLT_PROXY_URL /
# OLT_PROXY_TOKEN repository secrets. If the proxy goes down or the secrets
# are missing, flip skip_olt to 'true' to keep cloud runs green.
#
# What's committed vs not:
#   * public/data/unified.json (~35MB) is committed -- it's what the
#     website reads.
#   * Per-source raw JSONs are NOT committed -- they exist only as the
#     `all-scrapers` GitHub Actions artifact (30-day retention), for
#     debugging AND as the input to availability.yml runs.
#   * report.txt and review.json from dedupe are in the `unified-shows`
#     artifact (30-day retention) and not committed.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Per-scraper limit (leave empty for full scrape)'
        required: false
        default: ''
      skip_browser:
        description: 'Skip the Playwright scrapers (todaytix, seatplan)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_olt:
        description: 'Skip OLT (set true only if the Cloudflare Worker proxy is down or its secrets are missing)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      drop_ghost_listings:
        description: 'Drop dedupe clusters with 0 performances (stale/announced-only shows)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_publish:
        description: 'Skip committing the unified output (artifacts still uploaded)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# `contents: write` is for the publish step's commit to main.
permissions:
  contents: write

# This workflow and availability.yml both end with a commit to main;
# back-to-back commits would race. Both share ONE concurrency group so
# they serialise. cancel-in-progress is false so a queued run waits for an
# in-flight one to finish rather than being cancelled (cancelling would
# lose that run's refresh entirely).
concurrency:
  group: scrape-and-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false   # one scraper failing shouldn't cancel the rest
      matrix:
        include:
          - { name: todaytix,            script: scraper/todaytix_scraper.py,            playwright: true }
          - { name: olt,                 script: scraper/olt_scraper.py,                 playwright: false }
          - { name: lovetheatre,         script: scraper/lovetheatre_scraper.py,         playwright: false }
          - { name: seatplan,            script: scraper/seatplan_scraper.py,            playwright: true  }
          - { name: ttd,                 script: scraper/ttd_scraper.py,                 playwright: false }

    steps:
      - name: Gate
        id: gate
        run: |
          RUN="true"
          if [ "${{ inputs.skip_browser }}" = "true" ] && [ "${{ matrix.playwright }}" = "true" ]; then
            echo "skip_browser=true and ${{ matrix.name }} needs a browser -- skipping."
            RUN="false"
          fi
          if [ "${{ inputs.skip_olt }}" = "true" ] && [ "${{ matrix.name }}" = "olt" ]; then
            echo "skip_olt=true -- skipping olt."
            RUN="false"
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Check out repo
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        if: steps.gate.outputs.run == 'true' && matrix.playwright
        run: playwright install --with-deps chromium

      - name: Run scraper
        if: steps.gate.outputs.run == 'true'
        env:
          # SeatPlan is proxied via a separate AWS Lambda (SEATPLAN_PROXY_URL)
          # because seatplan.com sits behind AWS / CloudFront + AWS WAF, which
          # blocks the Cloudflare Worker's egress IPs. Routing SeatPlan through
          # AWS's own egress (same cloud as the origin) sidesteps that block.
          # Everything else (OLT, SeeTickets) keeps using the Cloudflare Worker
          # via OLT_PROXY_URL. We keep the env var NAMED OLT_PROXY_URL (that's
          # what every scraper reads); only its VALUE differs for the seatplan
          # leg, which also uses its own dedicated token (SEATPLAN_PROXY_TOKEN).
          OLT_PROXY_URL: ${{ matrix.name == 'seatplan' && secrets.SEATPLAN_PROXY_URL || secrets.OLT_PROXY_URL }}
          OLT_PROXY_TOKEN: ${{ matrix.name == 'seatplan' && secrets.SEATPLAN_PROXY_TOKEN || secrets.OLT_PROXY_TOKEN }}
        # Exit code policy (matches smoke_test.py):
        #   0 = clean
        #   2 = scraper wrote output, but flagged warnings (still success)
        #   anything else = hard failure
        run: |
          mkdir -p scraper/data
          ARGS=""
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="--limit ${{ inputs.limit }}"
          fi
          # SeatPlan is proxied via the AWS Lambda, whose parallelism is bounded
          # by the AWS account's "Concurrent executions" quota (low on new
          # accounts, ~10). Cap SeatPlan workers below that so the Lambda doesn't
          # return 429 ConcurrentInvocationLimitExceeded. Other sources are
          # unaffected and keep the default 16.
          if [ "${{ matrix.name }}" = "seatplan" ]; then
            ARGS="$ARGS --concurrency 8"
          fi
          set +e
          python ${{ matrix.script }} $ARGS --out scraper/data/${{ matrix.name }}.json
          EXIT=$?
          set -e
          echo "Scraper exit code: $EXIT"
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 2 ]; then
            echo "::error::${{ matrix.name }} failed with exit code $EXIT"
            exit "$EXIT"
          fi

      - name: Verify output file
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ ! -f "scraper/data/${{ matrix.name }}.json" ]; then
            echo "::error::${{ matrix.name }} did not produce an output file"
            exit 1
          fi
          python -c "
          import json, sys
          d = json.load(open('scraper/data/${{ matrix.name }}.json'))
          perfs = d.get('performance_count') or d.get('showtime_count') or 0
          warns = len((d.get('report') or {}).get('warnings') or [])
          fails = len((d.get('report') or {}).get('failures') or [])
          print(f'shows={d.get(\"show_count\")} perfs={perfs} warnings={warns} failures={fails}')
          "

      - name: Restore SeatPlan chip-pass cache
        # The chip cache stores prior chip-pass results keyed by
        # (date|time|book_url) so the next run can skip extraction
        # for perfs whose catalogue inputs haven't changed. At 15-min
        # scrape cadence this drops steady-state chip-pass cost from
        # ~250 extractions to ~5-20 (only the rows that actually
        # changed inputs since last run). TTL is 24h — even unchanged
        # rows get re-verified daily to catch source-side drift.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'seatplan'
        uses: actions/cache@v4
        with:
          path: |
            scraper/data/chip_cache_seatplan.json
            scraper/data/seatplan_price_cache.json
          key: chip-cache-seatplan-${{ github.run_id }}
          restore-keys: |
            chip-cache-seatplan-

      - name: Verify SeatPlan per-performance prices
        # The fireCrmEvent pass (requests-only) handles ~95% of perfs.
        # The remaining ~5% — yard tiers, premium-default outliers —
        # are re-verified by a Playwright chip pass that reads the
        # actually-rendered price tiers from the booking page. That
        # second pass needs Chromium, which is why the seatplan
        # matrix entry has playwright: true even though the scraper
        # itself doesn't use Playwright. Use --skip-chips to disable
        # the chip pass if it ever misbehaves; fireCrmEvent values
        # will be used for all perfs in that case.
        #
        # The fireCrmEvent pass now routes through the SeatPlan AWS Lambda
        # (SEATPLAN_PROXY_URL, same egress as the scrape), so the previous
        # "0/386 verified" failure from AWS-WAF/CloudFront blocking the
        # Cloudflare Worker's egress is fixed. The chip pass
        # is still direct — it uses Playwright, which doesn't share
        # the requests-based proxy plumbing; if SeatPlan blocks the
        # browser-driven chip pass, this step exits 2 but
        # continue-on-error keeps the pipeline moving (dedupe falls
        # back to fireCrmEvent values for those rows). That fallback
        # is acceptable because the chip pass only runs on a small
        # subset of suspect rows.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'seatplan'
        continue-on-error: true
        env:
          # SeatPlan sits behind AWS WAF, which serves a JS challenge (HTTP 202)
          # a plain HTTP client can't solve — so the requests-based fetcher only
          # ever verified a slice per run. Browser mode (--fetch-mode browser)
          # fixes that: it fetches every ticketing URL through ONE headless-
          # Chromium context that has solved the WAF challenge (the same
          # mechanism the chip pass uses), so the aws-waf-token rides along on
          # each in-page fetch, direct from the runner IP. The token has a
          # SHORT post-solve window: bursting it across a concurrent pool
          # collapsed it after ~100-160 fetches (every later request 202'd),
          # and lowering concurrency was WORSE (fewer fetches before the window
          # closed). seatplan_scraper.py never hits this because it fetches ONE
          # URL at a time and re-solves on each 202 — so the pass now does the
          # same: --concurrency 1 (serial), paced near the scraper's proven
          # ~1 req/s, re-solving the token on every challenge and retrying that
          # URL. Performances are verified SOONEST-FIRST (the cheapest-available
          # floor is almost always near-term), so the user-visible price stays
          # fresh every run; the far tail that doesn't fit --max-seconds 780
          # rolls over subsequent runs via --price-cache. If the WAF refuses
          # this runner IP outright (a run of unrecoverable 202s) the pass stops
          # fast and the cache carries the rest. The chip pass below is
          # unaffected (Playwright, runner-direct, continue-on-error).
          #
          # The proxy env below is UNUSED in browser mode (which goes direct);
          # it's retained so reverting to --fetch-mode requests (burst + shuffle
          # + price-cache, the proven rolling fallback) is a one-flag change.
          OLT_PROXY_URL: ${{ secrets.SEATPLAN_PROXY_URL }}
          OLT_PROXY_TOKEN: ${{ secrets.SEATPLAN_PROXY_TOKEN }}
        run: |
          python scraper/seatplan_availability.py \
            --in scraper/data/seatplan.json \
            --chip-cache scraper/data/chip_cache_seatplan.json \
            --price-cache scraper/data/seatplan_price_cache.json \
            --fetch-mode browser \
            --concurrency 1 \
            --max-seconds 780

      - name: Verify OLT per-performance availability
        if: steps.gate.outputs.run == 'true' && matrix.name == 'olt'
        # Don't fail the pipeline if SeeTickets blocks us. The script
        # writes partial output regardless; dedupe falls back to the
        # data-cal min/max for any perf without verified data. The OLT
        # bug (stale calendar) is just left unfixed for that run.
        continue-on-error: true
        env:
          OLT_PROXY_URL: ${{ secrets.OLT_PROXY_URL }}
          OLT_PROXY_TOKEN: ${{ secrets.OLT_PROXY_TOKEN }}
          # Force line-buffered output so the time-based heartbeat
          # surfaces in the CI log in real time instead of being
          # block-buffered until the process exits.
          PYTHONUNBUFFERED: "1"
        run: |
          python scraper/olt_availability.py \
            --in scraper/data/olt.json \
            --within-days 10

      - name: OLT availability — report block from JSON
        # Always runs (even if the verifier step above failed) so the
        # CI log has a labelled, easy-to-find summary of what the
        # verifier wrote into olt.json. Independent of the verifier's
        # stdout, which can scroll off / get truncated.
        if: always() && steps.gate.outputs.run == 'true' && matrix.name == 'olt'
        continue-on-error: true
        run: |
          python <<'PY'
          import json, sys
          try:
              d = json.load(open("scraper/data/olt.json"))
          except Exception as e:
              print(f"::warning::Couldn't read olt.json for report: {e}")
              sys.exit(0)
          rpt = (d.get("report") or {}).get("availability_verification")
          if not rpt:
              print("::warning::No availability_verification block in olt.json")
              sys.exit(0)
          print("===== availability_verification (from olt.json) =====")
          print(json.dumps(rpt, indent=2, ensure_ascii=False))
          # GitHub Actions warning ribbons for quick scanning.
          fail_rate = (rpt.get("fetch_failed", 0)
                       / max(rpt.get("total_checked", 1), 1))
          if fail_rate > 0.20:
              print(f"::warning::OLT verifier fetch_failed rate {fail_rate:.1%} > 20% — proxy/upstream issue")
          elif rpt.get("ok", 0) == 0 and rpt.get("total_checked", 0) > 0:
              print("::warning::OLT verifier returned zero ok results — investigate")
          PY

      - name: OLT availability — spot-check Beetlejuice 22 May 19:30
        # The original bug case. If this perf comes back available=True
        # with min_price=83 the verifier is silently broken.
        if: always() && steps.gate.outputs.run == 'true' && matrix.name == 'olt'
        continue-on-error: true
        run: |
          python <<'PY'
          import json
          d = json.load(open("scraper/data/olt.json"))
          target_date, target_time = "2026-05-22", "19:30"
          for s in d.get("shows") or []:
              if (s.get("name") or "").lower().startswith("beetlejuice"):
                  for p in s.get("performances") or []:
                      if p.get("date") == target_date and p.get("time") == target_time:
                          print("Beetlejuice 22 May 19:30 verification snapshot:")
                          for k in ("verified_price_source", "verified_status",
                                    "verified_available", "verified_min_price",
                                    "verified_max_price", "verified_tier_count",
                                    "verified_available_tier_count",
                                    "min_price", "max_price", "available",
                                    "verified_url"):
                              if k in p:
                                  print(f"  {k:35} = {p[k]!r}")
                          break
                  break
          else:
              print("(Beetlejuice show not found — skipping spot-check)")
          PY

      - name: Restore TodayTix chip-pass cache
        # See the SeatPlan cache step for rationale. Same TTL and
        # restore-key strategy; separate cache because the cache key
        # space (date|time|book_url) and input-hash inputs are
        # source-specific.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'todaytix'
        uses: actions/cache@v4
        with:
          path: scraper/data/chip_cache_todaytix.json
          key: chip-cache-todaytix-${{ github.run_id }}
          restore-keys: |
            chip-cache-todaytix-

      - name: Verify TodayTix per-performance prices
        # Runs the chip-pass second pass over showtimes whose SSR
        # snapshot looks suspect (cheapest band has <3 seats and
        # within 14 days). This is the TT analogue of the SeatPlan
        # chip pass — it catches inventory that sold out between
        # scrape time and click time. The TT matrix entry already
        # has playwright: true (the scraper itself uses it), so
        # Chromium is provisioned in this job and no further
        # workflow change is needed. ~13 min on ~200 suspect rows
        # at the default 1 worker; bump --workers cautiously since
        # TodayTix is sensitive to bot detection.
        # continue-on-error: see SeatPlan step above for rationale.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'todaytix'
        continue-on-error: true
        run: |
          python scraper/todaytix_availability.py \
            --in scraper/data/todaytix.json \
            --chip-cache scraper/data/chip_cache_todaytix.json

      - name: Verify TTD per-performance prices
        # continue-on-error: see SeatPlan step above for rationale.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'ttd'
        continue-on-error: true
        run: |
          python scraper/ttd_availability.py --in scraper/data/ttd.json

      - name: Verify TTD seat-plan prices (ground truth)
        # continue-on-error: see SeatPlan step above for rationale.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'ttd'
        continue-on-error: true
        run: |
          python scraper/ttd_seat_verification.py --in scraper/data/ttd.json

      - name: Verify LoveTheatre per-performance availability
        # Re-queries the booking-flow calendar API and marks any perfs
        # that USED to be in the calendar but aren't anymore as
        # `max_seats=0` + `availability=""` so dedupe's lovetheatre
        # `available` lambda flips to false. The 22 May 2026 14:00
        # Cursed Child case: at scrape time the perf was still in
        # /api/calendar/{show_id}/; the live calendar dropped it an
        # hour later as the box office cutoff approached; our cached
        # data kept saying available until this verifier ran.
        # continue-on-error: see SeatPlan step above for rationale.
        if: steps.gate.outputs.run == 'true' && matrix.name == 'lovetheatre'
        continue-on-error: true
        run: |
          python scraper/lovetheatre_availability.py \
            --in scraper/data/lovetheatre.json \
            --within-days 10

      - name: Upload per-scraper artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-output
          path: scraper/data/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  combine:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download all per-scraper artifacts
        uses: actions/download-artifact@v4
        with:
          path: data/
          merge-multiple: true
          pattern: '*-output'

      - name: List what we got
        run: ls -la data/ || true

      - name: Upload combined artifact
        # This is the canonical "raw per-source files from a full scrape"
        # artifact. Availability-mode runs look for the most recent run
        # that produced one of these (filtered to event != "schedule")
        # and use it as their input.
        uses: actions/upload-artifact@v4
        with:
          name: all-scrapers
          path: data/
          if-no-files-found: error
          retention-days: 30

  dedupe:
    needs: combine
    if: always() && needs.combine.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dedupe dependencies
        run: pip install rapidfuzz pyyaml

      - name: Download per-source files
        uses: actions/download-artifact@v4
        with:
          name: all-scrapers
          path: data/

      - name: Sanity-check inputs
        run: |
          ls -la data/
          n=$(ls data/*.json 2>/dev/null | wc -l)
          echo "Source JSON files present: $n"
          if [ "$n" -lt 2 ]; then
            echo "::warning::only $n source file(s) -- dedupe will produce mostly singletons"
          fi

      - name: Run dedupe
        run: |
          mkdir -p dedupe_output
          OVERRIDES=""
          if [ -f scraper/analysis/overrides.yaml ]; then
            OVERRIDES="--overrides scraper/analysis/overrides.yaml"
          elif [ -f scraper/analysis/overrides.json ]; then
            OVERRIDES="--overrides scraper/analysis/overrides.json"
          fi
          MIN_PERFS=""
          if [ "${{ inputs.drop_ghost_listings }}" = "true" ]; then
            MIN_PERFS="--min-performances 1"
          fi
          python scraper/analysis/dedupe.py data/ --out dedupe_output $OVERRIDES $MIN_PERFS

      - name: Summarise result
        run: |
          python -c "
          import json
          with open('dedupe_output/unified.json') as f:
              u = json.load(f)
          print(f\"shows={u['show_count']}  performances={u['performance_count']}\")
          dist = u.get('coverage_distribution', {})
          for n in sorted(dist.keys(), key=int, reverse=True):
              print(f'  {n} sources: {dist[n]} shows')
          stages = u.get('stages', {})
          rescues = stages.get('stage_4_orphan_rescues', [])
          attached = sum(1 for r in rescues if r.get('status') == 'attached')
          print(f\"Stage 3 fuzzy auto-merges:    {len(stages.get('stage_3_fuzzy_merges', []))}\")
          print(f\"Stage 4 orphans attached:     {attached}\")
          print(f\"Stage 5 overrides applied:    {len(stages.get('stage_5_overrides_applied', []))}\")
          "

      - name: Upload unified-shows artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-shows
          path: dedupe_output/
          if-no-files-found: error
          retention-days: 30

  publish:
    # Commit the unified.json to main. CF Pages picks up the commit and
    # rebuilds the site with the fresh data baked in.
    needs: dedupe
    if: always() && needs.dedupe.result == 'success' && inputs.skip_publish != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Download unified output
        uses: actions/download-artifact@v4
        with:
          name: unified-shows
          path: dedupe_output/

      - name: Set up Python for history update
        # The history-update script is pure stdlib (json + zoneinfo +
        # pathlib + argparse) so no pip install is needed. We still pin
        # via setup-python for parity with the dedupe / availability
        # jobs and so we don't depend on whatever python3 the runner
        # image happens to ship.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coverage gate — block a collapsed scrape from going live
        # Refuse to overwrite the live unified.json if any source's show
        # count has collapsed versus what's currently published — e.g. the
        # TodayTix listing discovering 54/200 shows on a flaky run. A
        # non-zero exit fails the job HERE, before the copy in the next
        # step, so the live data is left untouched and yesterday's complete
        # file keeps serving. Pure stdlib; compares per-source show counts
        # plus global totals against public/data/unified.json, and fails
        # open only when there is no live baseline to compare against.
        run: |
          python scraper/analysis/coverage_gate.py \
            --new dedupe_output/unified.json \
            --live public/data/unified.json

      - name: Commit and push to main
        # Last-writer-wins with retry. unified.json is regenerated from
        # scratch each run, so two parallel builds produce two complete,
        # mutually-conflicting files -- rebase can't auto-merge them
        # (essentially every line differs after re-serialization). The
        # previous "git pull --rebase" strategy failed for exactly this
        # reason on the 2026-05-22 16:19Z availability run.
        #
        # Strategy: if the push is rejected, hard-reset to the latest
        # main, re-copy our freshly-built unified.json over the top, and
        # retry. Both modes produce equally-fresh full files by
        # construction, so the most recent finisher wins -- correct
        # semantics for a write-only data file.
        #
        # The workflow-level `concurrency: scrape-and-refresh` block
        # already serializes full vs availability runs of THIS workflow,
        # so under normal operation this loop pushes on the first
        # attempt. The retry is the safety net for anything outside that
        # lock (human commits, other workflows touching main, etc).
        #
        # unified.json (raw) and the per-month price-history shards
        # (public/data/price_history/<YYYY-MM>.json.gz + index.json) are
        # committed -- report.txt and review.json stay as workflow
        # artifacts. unified.json is gzipped at build time by
        # scripts/gzip-data.mjs; the history shards are committed already
        # gzipped and shipped to the CDN as-is.
        #
        # The price-history update lives INSIDE the retry loop, after
        # `git reset --hard origin/main` and before `git add`. That's
        # deliberate: a parallel run that won the race may have just
        # committed a newer price_history.json with snapshots we don't
        # have yet, and we want to rebase OUR new snapshot onto that
        # rather than overwrite their work. Running the script outside
        # the loop would mean either (a) updating against a stale base
        # the reset then wipes, or (b) updating against a base the next
        # iteration's reset wipes anyway. Inside-the-loop is the only
        # correct placement.
        run: |
          set -e
          MSG_PREFIX="data: refresh from full scrape"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_ATTEMPTS=5
          for i in $(seq 1 $MAX_ATTEMPTS); do
            git fetch origin main
            git reset --hard origin/main

            mkdir -p public/data
            cp dedupe_output/unified.json public/data/unified.json

            # Append a snapshot for any (show, date, time) whose price
            # payload moved vs its last recorded entry; prune buckets
            # whose perf date is strictly past in London local time;
            # prune show_ids no longer in unified. Writes per-month gzip
            # shards under public/data/price_history/ (+ index.json), and
            # on the first run migrates from — and deletes — the legacy
            # monolithic public/data/price_history.json. Idempotent w.r.t.
            # unified.generated_at, so a re-iteration of this loop on the
            # same dedupe output never produces duplicate entries.
            python scraper/analysis/update_price_history.py \
              --unified public/data/unified.json \
              --history-dir public/data/price_history

            # Stage everything under public/data: the regenerated
            # unified.json, the changed month shards + manifest, any shard
            # removed as a month emptied, and (on the migration run) the
            # deletion of the old price_history.json monolith.
            git add -A public/data

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "$MSG_PREFIX ($(date -u +%Y-%m-%dT%H:%MZ))"

            # Distinguish a retryable concurrent-push race from a fatal
            # pre-receive rejection (e.g. GitHub's 100 MB-per-file limit).
            # Retrying the latter is pointless — each iteration rebuilds
            # the same blob and fails identically, which is exactly how the
            # old monolith wedged this job for an entire run — so bail
            # immediately and surface it.
            if push_out="$(git push origin main 2>&1)"; then
              echo "$push_out"
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "$push_out"
            if echo "$push_out" | grep -qiE "exceeds GitHub's file size limit|GH001: Large files detected"; then
              echo "::error::Push rejected by a file-size limit; retrying cannot help. Check public/data for an oversized blob (price history should be sharded under public/data/price_history/)."
              exit 1
            fi
            echo "Push rejected on attempt $i (concurrent push?). Retrying..."
            sleep 2
          done
          echo "::error::Failed to push after $MAX_ATTEMPTS attempts."
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
